
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <meta name="description" content="LesiKo - Your destination for premium cosmetics and personalized skincare routines in Georgia. Discover top brands and science-backed beauty." />
    <title>LesiKo | Premium Skincare & Cosmetics</title>
    
    <!-- Process Shim: Prevents crashes in libraries expecting Node-like environment -->
    <script>
      window.process = { env: { NODE_ENV: 'production' } };
    </script>

    <!-- Global Error Catcher: Shows errors on screen if the app fails to mount -->
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        const root = document.getElementById('root');
        if (root && !root.innerHTML.trim()) {
          root.innerHTML = '<div style="padding: 20px; font-family: sans-serif; text-align: center;">' +
            '<h2>Application Error</h2>' +
            '<p style="color: #666;">' + msg + '</p>' +
            '<button onclick="location.reload()" style="padding: 10px 20px; background: #AED136; border: none; border-radius: 5px; color: white; cursor: pointer;">Retry</button>' +
            '</div>';
        }
        return false;
      };
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Montserrat:wght@400;500;600;700&family=Noto+Sans+Georgian:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                green: '#AED136',
                dark: '#1A1A1A',
                gray: '#6B7280',
                light: '#F9FAFB',
              },
              state: {
                success: '#10B981',
                warning: '#F59E0B',
                error: '#EF4444',
                info: '#3B82F6',
              }
            },
            fontFamily: {
              sans: ['Inter', 'Noto Sans Georgian', 'sans-serif'],
              heading: ['Montserrat', 'Noto Sans Georgian', 'sans-serif'],
            },
            transitionTimingFunction: {
              'premium': 'cubic-bezier(0.4, 0, 0.2, 1)',
            },
            container: {
              center: true,
              padding: '1.5rem',
            },
            animation: {
              'fade-in': 'fadeIn 0.6s ease-out forwards',
              'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
              'slide-in-right': 'slideInRight 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards',
              'slide-in-left': 'slideInLeft 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards',
              'scale-in': 'scaleIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards',
              'float': 'float 6s ease-in-out infinite',
              'bounce-x': 'bounceX 1s infinite',
            },
            keyframes: {
              fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              fadeInUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
              slideInRight: { '0%': { transform: 'translateX(100%)' }, '100%': { transform: 'translateX(0)' } },
              slideInLeft: { '0%': { transform: 'translateX(-100%)' }, '100%': { transform: 'translateX(0)' } },
              scaleIn: { '0%': { transform: 'scale(0.95)', opacity: '0' }, '100%': { transform: 'scale(1)', opacity: '1' } },
              float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } },
              bounceX: { '0%, 100%': { transform: 'translateX(0)' }, '50%': { transform: 'translateX(3px)' } }
            }
          }
        }
      }
    </script>
    <style>
      html { scroll-behavior: smooth; }
      body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      ::selection { background-color: #AED136; color: white; }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/": "https://esm.sh/react@18.3.1/",
    "react-dom": "https://esm.sh/react-dom@18.3.1?external=react",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
    "react-dom/": "https://esm.sh/react-dom@18.3.1/",
    "zustand": "https://esm.sh/zustand@4.5.2?external=react",
    "zustand/middleware": "https://esm.sh/zustand@4.5.2/middleware?external=react",
    "react-router-dom": "https://esm.sh/react-router-dom@6.22.3?external=react,react-dom",
    "lucide-react": "https://esm.sh/lucide-react@0.344.0?external=react",
    "i18next": "https://esm.sh/i18next@23.10.1",
    "react-i18next": "https://esm.sh/react-i18next@14.1.0?external=react,react-dom,i18next",
    "@mux/mux-player-react": "https://esm.sh/@mux/mux-player-react@2.6.0?external=react,react-dom",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.8",
    "zustand/": "https://esm.sh/zustand@^5.0.10/"
  }
}
</script>
</head>
  <body class="font-sans text-brand-dark antialiased bg-white">
    <div id="root"></div>
    <!-- Note: In local dev, this is transpiled. In production build, the bundler 
         should convert this to index.js or handle the tsx transpilation. -->
    <script type="module" src="index.tsx"></script>
  </body>
</html>
