
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <meta name="description" content="LesiKo - Your destination for premium cosmetics and personalized skincare routines in Georgia. Discover top brands and science-backed beauty." />
    <title>LesiKo | Premium Skincare & Cosmetics</title>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#AED136" />

    <!-- Boot splash. On screen from the first paint, before any script runs;
         the app lifts it once the page is complete (lib/splash.ts), and
         boot.js removes it after a hard cap no matter what. -->
    <style>
      #splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #ffffff; transition: opacity .35s ease, visibility .35s; }
      #splash.is-done { opacity: 0; visibility: hidden; pointer-events: none; }
      #splash .mark { font-family: Montserrat, Inter, system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.03em; color: #1A1A1A; line-height: 1; }
      #splash .mark b { color: #AED136; font-weight: 700; }
      #splash .bar { width: 120px; height: 2px; border-radius: 2px; background: #EEF0E8; overflow: hidden; }
      #splash .bar i { display: block; width: 40%; height: 100%; border-radius: 2px; background: #AED136; animation: splash-slide 1.1s ease-in-out infinite; }
      @keyframes splash-slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
      @media (prefers-reduced-motion: reduce) { #splash .bar i { animation: none; width: 100%; } #splash { transition: none; } }
    </style>

    <!-- Static fallbacks for scrapers that never reach the React SEO component.
         The seo edge function / Admin SEO page overwrite these for real shares. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LesiKo" />
    <meta property="og:title" content="LesiKo | Premium Skincare & Cosmetics" />
    <meta property="og:description" content="LesiKo - Your destination for premium cosmetics and personalized skincare routines in Georgia." />
    <meta property="og:image" content="/og-default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LesiKo | Premium Skincare & Cosmetics" />
    <meta name="twitter:description" content="LesiKo - Your destination for premium cosmetics and personalized skincare routines in Georgia." />
    <meta name="twitter:image" content="/og-default.png" />
    
    <!-- Boot script: process shim, legacy hash-URL rewrite and the mount-failure
         message. External rather than inline so the CSP can forbid inline scripts. -->
    <script src="/boot.js"></script>

    <!-- Every image, catalogue read and auth call goes to the Supabase origin,
         so the handshake is worth starting before React has parsed. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin>

    <!-- Fonts.
         Inter carries 700: 166 elements use `font-bold` on body text, and
         without the real face the browser synthesises it, which smears badly at
         the 10-11px uppercase sizes this design uses.
         Montserrat only ever renders at 600 and 700 — 400 and 500 were being
         downloaded and never used.
         Noto Sans Georgian keeps its full range but is served behind a
         unicode-range, so an English visitor never downloads any of it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@600;700&family=Noto+Sans+Georgian:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
</head>
  <body class="font-sans text-brand-dark antialiased bg-white">
    <div id="splash" aria-hidden="true">
      <div class="mark">Lesi<b>Ko</b>.</div>
      <div class="bar"><i></i></div>
    </div>
    <div id="root"></div>
    <!-- Note: In local dev, this is transpiled. In production build, the bundler 
         should convert this to index.js or handle the tsx transpilation. -->
    <script type="module" src="index.tsx"></script>
  </body>
</html>
