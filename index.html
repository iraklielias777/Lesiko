
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <meta name="description" content="LesiKo - Your destination for premium cosmetics and personalized skincare routines in Georgia. Discover top brands and science-backed beauty." />
    <title>LesiKo | Premium Skincare & Cosmetics</title>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#AED136" />

    <!-- Static fallbacks for scrapers that never reach the React SEO component.
         The seo edge function / Admin SEO page overwrite these for real shares. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LesiKo" />
    <meta property="og:title" content="LesiKo | Premium Skincare & Cosmetics" />
    <meta property="og:description" content="LesiKo - Your destination for premium cosmetics and personalized skincare routines in Georgia." />
    <meta property="og:image" content="/og-default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LesiKo | Premium Skincare & Cosmetics" />
    <meta name="twitter:description" content="LesiKo - Your destination for premium cosmetics and personalized skincare routines in Georgia." />
    <meta name="twitter:image" content="/og-default.png" />
    
    <!-- Process Shim: Prevents crashes in libraries expecting Node-like environment -->
    <script>
      window.process = { env: { NODE_ENV: 'production' } };
    </script>

    <!-- The app moved off HashRouter. Links shared while it was live still carry
         the fragment, so rewrite them to the real path before React boots. -->
    <script>
      if (location.hash.indexOf('#/') === 0) {
        var target = location.hash.slice(1);
        history.replaceState(null, '', target.indexOf('?') === -1 ? target + location.search : target);
      }
    </script>

    <!-- Global Error Catcher: Shows errors on screen if the app fails to mount -->
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        const root = document.getElementById('root');
        if (root && !root.innerHTML.trim()) {
          root.innerHTML = '<div style="padding: 20px; font-family: sans-serif; text-align: center;">' +
            '<h2>Application Error</h2>' +
            '<p style="color: #666;">' + msg + '</p>' +
            '<button onclick="location.reload()" style="padding: 10px 20px; background: #AED136; border: none; border-radius: 5px; color: white; cursor: pointer;">Retry</button>' +
            '</div>';
        }
        return false;
      };
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Montserrat:wght@400;500;600;700&family=Noto+Sans+Georgian:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
</head>
  <body class="font-sans text-brand-dark antialiased bg-white">
    <div id="root"></div>
    <!-- Note: In local dev, this is transpiled. In production build, the bundler 
         should convert this to index.js or handle the tsx transpilation. -->
    <script type="module" src="index.tsx"></script>
  </body>
</html>
